name: Cgrep acceptance

# A push to main runs acceptance at the gate tier. The nightly (07:00 UTC;
# Gitea schedules in UTC) and a run started by hand run it at the deep tier
# and keep the "Nightly findings" issue (ci/README.md).
on:
  push:
    branches: [main]
  schedule:
    - cron: '0 7 * * *'
  workflow_dispatch:

# Separate groups, so a queued push cannot displace a queued nightly or the
# reverse; ci/verify.sh's lock still runs one acceptance at a time.
concurrency:
  group: cgrep-${{ github.event_name == 'push' && 'acceptance' || 'nightly' }}
  cancel-in-progress: false

jobs:
  # A scheduled run builds only a commit that has no nightly result yet. This
  # check runs on the CI pool, so a night with nothing new never wakes the
  # build host: its job is skipped, not queued.
  unbuilt:
    if: github.event_name == 'schedule' && github.repository == 'trav/cgrep'
    runs-on: ci-arm64
    timeout-minutes: 5
    outputs:
      build: ${{ steps.check.outputs.build }}
    steps:
      - id: check
        env:
          TOKEN: ${{ github.token }}
          API: ${{ github.server_url }}/api/v1/repos/${{ github.repository }}
          SHA: ${{ github.sha }}
        # An unanswered status query builds anyway: a missed nightly is worse
        # than a repeated one.
        run: |
          statuses="$(curl -fsS -H "Authorization: token $TOKEN" "$API/commits/$SHA/statuses?limit=50" || echo '[]')"
          if printf '%s' "$statuses" | python3 -c 'import json, sys; sys.exit(0 if any(s.get("context") == sys.argv[1] and s.get("status") in ("success", "failure", "error") for s in json.load(sys.stdin)) else 1)' 'cgrep nightly'; then
            echo build=false >> "$GITHUB_OUTPUT"
            echo "$SHA already has a 'cgrep nightly' result; nothing to build"
          else
            echo build=true >> "$GITHUB_OUTPUT"
          fi

  acceptance:
    needs: unbuilt
    # A scheduled run's actor need not be trav (Gitea may attribute it to
    # whoever last changed the schedule). The server starts it from the
    # default branch's workflow, so it needs only the repository match.
    # Push and workflow_dispatch also require the trusted actor.
    if: >-
      always() && (github.event_name != 'schedule' || needs.unbuilt.outputs.build == 'true') &&
      github.repository == 'trav/cgrep' && (github.event_name == 'schedule' ||
      ((github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.actor == 'trav'))
    runs-on: cgrep-x86_64-3g
    # The toolchain selftest, then acceptance: 30 minutes at gate, 100 at deep.
    timeout-minutes: 140
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Full capped acceptance with pinned siblings
        run: bash ci/verify.sh ${{ github.event_name == 'push' && 'gate' || 'deep' }}
      - name: Retain acceptance evidence on pass or failure
        if: always()
        # v3.1.3 uses the legacy artifact protocol/node16 action descriptor.
        # Do not select node24/v4 without validating the installed runner.
        uses: actions/upload-artifact@a8a3f3ad30e3422c9c7b888a15615d19a852ae32
        with:
          name: acceptance-${{ github.sha }}-${{ github.run_id }}
          path: ci-artifacts/
          if-no-files-found: error
          retention-days: 30
      - name: Record the nightly result on the commit
        if: always() && github.event_name != 'push'
        env:
          TOKEN: ${{ github.token }}
          API: ${{ github.server_url }}/api/v1/repos/${{ github.repository }}
          SHA: ${{ github.sha }}
          STATE: ${{ job.status == 'success' && 'success' || 'failure' }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          curl -fsS -X POST -H "Authorization: token $TOKEN" -H 'Content-Type: application/json' \
            -d "{\"state\":\"$STATE\",\"context\":\"cgrep nightly\",\"target_url\":\"$RUN_URL\"}" \
            "$API/statuses/$SHA" >/dev/null
