name: Cgrep acceptance

# A push to main runs acceptance at the gate tier. The nightly (07:00 UTC;
# Gitea schedules in UTC) and a run started by hand run it at the deep tier
# and keep the "Nightly findings" issue (ci/README.md).
on:
  push:
    branches: [main]
  schedule:
    - cron: '0 7 * * *'
  workflow_dispatch:

# Separate groups, so a queued push cannot displace a queued nightly or the
# reverse; ci/verify.sh's lock still runs one acceptance at a time.
concurrency:
  group: cgrep-${{ github.event_name == 'push' && 'acceptance' || 'nightly' }}
  cancel-in-progress: false

jobs:
  acceptance:
    # A scheduled run's actor need not be trav (Gitea may attribute it to
    # whoever last changed the schedule). The server starts it from the
    # default branch's workflow, so it needs only the repository match.
    # Push and workflow_dispatch also require the trusted actor.
    if: >-
      github.repository == 'trav/cgrep' && (github.event_name == 'schedule' ||
      ((github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.actor == 'trav'))
    runs-on: cgrep-x86_64-3g
    # The toolchain selftest, then acceptance: 30 minutes at gate, 100 at deep.
    timeout-minutes: 130
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Full capped acceptance with pinned siblings
        run: bash ci/verify.sh ${{ github.event_name == 'push' && 'gate' || 'deep' }}
      - name: Retain acceptance evidence on pass or failure
        if: always()
        # v3.1.3 uses the legacy artifact protocol/node16 action descriptor.
        # Do not select node24/v4 without validating the installed runner.
        uses: actions/upload-artifact@a8a3f3ad30e3422c9c7b888a15615d19a852ae32
        with:
          name: acceptance-${{ github.sha }}-${{ github.run_id }}
          path: ci-artifacts/
          if-no-files-found: error
          retention-days: 30
