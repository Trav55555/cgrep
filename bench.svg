<svg xmlns="http://www.w3.org/2000/svg" width="944" height="420" viewBox="0 0 944 420" role="img" aria-labelledby="title desc">
<title id="title">cgrep vs rg benchmark</title>
<desc id="desc">Median wall time of 15 warm runs, process startup included. cgrep 0.1.0 (5cbc639, c-utils b74b8a9) at 5cbc639; ripgrep 15.2.0 (rev e89fff89ac). One thread: cgrep -j1, rg -j1 --sort path. Default threads: no thread option, so each tool uses its own default thread count. GitHub-hosted ubuntu-24.04 runner, 4 CPUs, AMD EPYC 9V45 96-Core Processor. Shared CI runners are noisy: compare ratios, not absolute times.</desc>
<style>
.bg{fill:#fcfcfb}.rule{stroke:#e1e0d9}.ring{fill:none;stroke:rgba(11,11,11,0.10)}
.t1{fill:#0b0b0b}.t2{fill:#52514e}.t3{fill:#898781}.good{fill:#006300}.muted{fill:#52514e}
@media (prefers-color-scheme: dark){
.bg{fill:#1a1a19}.rule{stroke:#2c2c2a}.ring{stroke:rgba(255,255,255,0.10)}
.t1{fill:#f0efec}.t2{fill:#c3c2b7}.good{fill:#0ca30c}.muted{fill:#c3c2b7}}
text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;
font-variant-numeric:tabular-nums}
.title{font-size:16px;font-weight:600}.group{font-size:12px;font-weight:600}
.head{font-size:12px;font-weight:600}
.cell{font-size:13px}.sub{font-size:12px}.note{font-size:11px}.strong{font-weight:600}
</style>
<rect class="bg" width="944" height="420" rx="8"/>
<rect class="ring" x="0.5" y="0.5" width="943" height="419" rx="8"/>
<text class="t1 title" x="24" y="36">cgrep vs rg, warm median wall time in ms</text>
<text class="t2 sub" x="24" y="58">Lower is better. Commit 5cbc639; ripgrep 15.2.0 (rev e89fff89ac).</text>
<text class="t3 head" x="24" y="104">Tree and query</text>
<text class="t2 group" x="420" y="84">One thread</text>
<line class="rule" x1="420" x2="660" y1="90" y2="90"/>
<text class="t3 head" x="465" y="104" text-anchor="end">cgrep</text>
<text class="t3 head" x="535" y="104" text-anchor="end">rg</text>
<text class="t3 head" x="660" y="104" text-anchor="end">cgrep vs rg</text>
<text class="t2 group" x="680" y="84">Default threads</text>
<line class="rule" x1="680" x2="920" y1="90" y2="90"/>
<text class="t3 head" x="725" y="104" text-anchor="end">cgrep</text>
<text class="t3 head" x="795" y="104" text-anchor="end">rg</text>
<text class="t3 head" x="920" y="104" text-anchor="end">cgrep vs rg</text>
<line class="rule" x1="24" x2="920" y1="118" y2="118"/>
<text class="cell" x="24" y="140"><tspan class="t1">wide: 20,000 files, 1 dir</tspan><tspan class="t2"> · -l WORD</tspan></text>
<text class="t1 cell strong" x="465" y="140" text-anchor="end">105.23</text>
<text class="t1 cell" x="535" y="140" text-anchor="end">126.38</text>
<text class="good cell strong" x="660" y="140" text-anchor="end">1.20x faster</text>
<text class="t1 cell strong" x="725" y="140" text-anchor="end">43.89</text>
<text class="t1 cell" x="795" y="140" text-anchor="end">51.25</text>
<text class="good cell strong" x="920" y="140" text-anchor="end">1.17x faster</text>
<line class="rule" x1="24" x2="920" y1="152" y2="152"/>
<text class="cell" x="24" y="174"><tspan class="t1">wide: 20,000 files, 1 dir</tspan><tspan class="t2"> · WORD (lines)</tspan></text>
<text class="t1 cell strong" x="465" y="174" text-anchor="end">102.03</text>
<text class="t1 cell" x="535" y="174" text-anchor="end">126.25</text>
<text class="good cell strong" x="660" y="174" text-anchor="end">1.24x faster</text>
<text class="t1 cell strong" x="725" y="174" text-anchor="end">41.89</text>
<text class="t1 cell" x="795" y="174" text-anchor="end">51.33</text>
<text class="good cell strong" x="920" y="174" text-anchor="end">1.23x faster</text>
<line class="rule" x1="24" x2="920" y1="186" y2="186"/>
<text class="cell" x="24" y="208"><tspan class="t1">manydirs: 9,330 files, 1,555 dirs</tspan><tspan class="t2"> · -l WORD</tspan></text>
<text class="t1 cell strong" x="465" y="208" text-anchor="end">59.45</text>
<text class="t1 cell" x="535" y="208" text-anchor="end">80.50</text>
<text class="good cell strong" x="660" y="208" text-anchor="end">1.35x faster</text>
<text class="t1 cell strong" x="725" y="208" text-anchor="end">22.15</text>
<text class="t1 cell" x="795" y="208" text-anchor="end">27.45</text>
<text class="good cell strong" x="920" y="208" text-anchor="end">1.24x faster</text>
<line class="rule" x1="24" x2="920" y1="220" y2="220"/>
<text class="cell" x="24" y="242"><tspan class="t1">manydirs: 9,330 files, 1,555 dirs</tspan><tspan class="t2"> · WORD (lines)</tspan></text>
<text class="t1 cell strong" x="465" y="242" text-anchor="end">58.70</text>
<text class="t1 cell" x="535" y="242" text-anchor="end">82.41</text>
<text class="good cell strong" x="660" y="242" text-anchor="end">1.40x faster</text>
<text class="t1 cell strong" x="725" y="242" text-anchor="end">21.64</text>
<text class="t1 cell" x="795" y="242" text-anchor="end">28.09</text>
<text class="good cell strong" x="920" y="242" text-anchor="end">1.30x faster</text>
<line class="rule" x1="24" x2="920" y1="254" y2="254"/>
<text class="cell" x="24" y="276"><tspan class="t1">mixed: 5,016 files, 52 dirs</tspan><tspan class="t2"> · -l WORD</tspan></text>
<text class="t1 cell strong" x="465" y="276" text-anchor="end">107.17</text>
<text class="t1 cell" x="535" y="276" text-anchor="end">47.35</text>
<text class="muted cell strong" x="660" y="276" text-anchor="end">2.26x slower</text>
<text class="t1 cell strong" x="725" y="276" text-anchor="end">48.59</text>
<text class="t1 cell" x="795" y="276" text-anchor="end">19.80</text>
<text class="muted cell strong" x="920" y="276" text-anchor="end">2.45x slower</text>
<line class="rule" x1="24" x2="920" y1="288" y2="288"/>
<text class="cell" x="24" y="310"><tspan class="t1">mixed: 5,016 files, 52 dirs</tspan><tspan class="t2"> · WORD (lines)</tspan></text>
<text class="t1 cell strong" x="465" y="310" text-anchor="end">43.68</text>
<text class="t1 cell" x="535" y="310" text-anchor="end">49.16</text>
<text class="good cell strong" x="660" y="310" text-anchor="end">1.13x faster</text>
<text class="t1 cell strong" x="725" y="310" text-anchor="end">17.08</text>
<text class="t1 cell" x="795" y="310" text-anchor="end">20.46</text>
<text class="good cell strong" x="920" y="310" text-anchor="end">1.20x faster</text>
<line class="rule" x1="24" x2="920" y1="322" y2="322"/>
<text class="t3 note" x="24" y="346">15 warm runs per cell, process startup included. One thread: cgrep -j1, rg -j1 --sort path. Default: no thread option for either tool.</text>
<text class="t3 note" x="24" y="363">cgrep 0.1.0 (5cbc639, c-utils b74b8a9); ripgrep 15.2.0 (rev e89fff89ac).</text>
<text class="t3 note" x="24" y="380">GitHub-hosted ubuntu-24.04 runner, 4 CPUs, AMD EPYC 9V45 96-Core Processor. Shared runners are noisy: compare ratios.</text>
</svg>
