<svg xmlns="http://www.w3.org/2000/svg" width="944" height="420" viewBox="0 0 944 420" role="img" aria-labelledby="title desc">
<title id="title">cgrep vs rg benchmark</title>
<desc id="desc">Median wall time of 15 warm runs, process startup included. cgrep 0.1.0 (5a44692, c-utils 7750e1c) at 5a44692; ripgrep 15.2.0 (rev e89fff89ac). One thread: cgrep -j1, rg -j1 --sort path. Default threads: no thread option, so each tool uses its own default thread count. GitHub-hosted ubuntu-24.04 runner, 4 CPUs, AMD EPYC 7763 64-Core Processor. Shared CI runners are noisy: compare ratios, not absolute times.</desc>
<style>
.bg{fill:#fcfcfb}.rule{stroke:#e1e0d9}.ring{fill:none;stroke:rgba(11,11,11,0.10)}
.t1{fill:#0b0b0b}.t2{fill:#52514e}.t3{fill:#898781}.good{fill:#006300}.muted{fill:#52514e}
@media (prefers-color-scheme: dark){
.bg{fill:#1a1a19}.rule{stroke:#2c2c2a}.ring{stroke:rgba(255,255,255,0.10)}
.t1{fill:#f0efec}.t2{fill:#c3c2b7}.good{fill:#0ca30c}.muted{fill:#c3c2b7}}
text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;
font-variant-numeric:tabular-nums}
.title{font-size:16px;font-weight:600}.group{font-size:12px;font-weight:600}
.head{font-size:12px;font-weight:600}
.cell{font-size:13px}.sub{font-size:12px}.note{font-size:11px}.strong{font-weight:600}
</style>
<rect class="bg" width="944" height="420" rx="8"/>
<rect class="ring" x="0.5" y="0.5" width="943" height="419" rx="8"/>
<text class="t1 title" x="24" y="36">cgrep vs rg, warm median wall time in ms</text>
<text class="t2 sub" x="24" y="58">Lower is better. Commit 5a44692; ripgrep 15.2.0 (rev e89fff89ac).</text>
<text class="t3 head" x="24" y="104">Tree and query</text>
<text class="t2 group" x="420" y="84">One thread</text>
<line class="rule" x1="420" x2="660" y1="90" y2="90"/>
<text class="t3 head" x="465" y="104" text-anchor="end">cgrep</text>
<text class="t3 head" x="535" y="104" text-anchor="end">rg</text>
<text class="t3 head" x="660" y="104" text-anchor="end">cgrep vs rg</text>
<text class="t2 group" x="680" y="84">Default threads</text>
<line class="rule" x1="680" x2="920" y1="90" y2="90"/>
<text class="t3 head" x="725" y="104" text-anchor="end">cgrep</text>
<text class="t3 head" x="795" y="104" text-anchor="end">rg</text>
<text class="t3 head" x="920" y="104" text-anchor="end">cgrep vs rg</text>
<line class="rule" x1="24" x2="920" y1="118" y2="118"/>
<text class="cell" x="24" y="140"><tspan class="t1">wide: 20,000 files, 1 dir</tspan><tspan class="t2"> · -l WORD</tspan></text>
<text class="t1 cell strong" x="465" y="140" text-anchor="end">132.29</text>
<text class="t1 cell" x="535" y="140" text-anchor="end">162.67</text>
<text class="good cell strong" x="660" y="140" text-anchor="end">1.23x faster</text>
<text class="t1 cell strong" x="725" y="140" text-anchor="end">60.69</text>
<text class="t1 cell" x="795" y="140" text-anchor="end">68.89</text>
<text class="good cell strong" x="920" y="140" text-anchor="end">1.14x faster</text>
<line class="rule" x1="24" x2="920" y1="152" y2="152"/>
<text class="cell" x="24" y="174"><tspan class="t1">wide: 20,000 files, 1 dir</tspan><tspan class="t2"> · WORD (lines)</tspan></text>
<text class="t1 cell strong" x="465" y="174" text-anchor="end">131.66</text>
<text class="t1 cell" x="535" y="174" text-anchor="end">164.40</text>
<text class="good cell strong" x="660" y="174" text-anchor="end">1.25x faster</text>
<text class="t1 cell strong" x="725" y="174" text-anchor="end">60.90</text>
<text class="t1 cell" x="795" y="174" text-anchor="end">68.99</text>
<text class="good cell strong" x="920" y="174" text-anchor="end">1.13x faster</text>
<line class="rule" x1="24" x2="920" y1="186" y2="186"/>
<text class="cell" x="24" y="208"><tspan class="t1">manydirs: 9,330 files, 1,555 dirs</tspan><tspan class="t2"> · -l WORD</tspan></text>
<text class="t1 cell strong" x="465" y="208" text-anchor="end">74.09</text>
<text class="t1 cell" x="535" y="208" text-anchor="end">104.69</text>
<text class="good cell strong" x="660" y="208" text-anchor="end">1.41x faster</text>
<text class="t1 cell strong" x="725" y="208" text-anchor="end">31.05</text>
<text class="t1 cell" x="795" y="208" text-anchor="end">40.53</text>
<text class="good cell strong" x="920" y="208" text-anchor="end">1.31x faster</text>
<line class="rule" x1="24" x2="920" y1="220" y2="220"/>
<text class="cell" x="24" y="242"><tspan class="t1">manydirs: 9,330 files, 1,555 dirs</tspan><tspan class="t2"> · WORD (lines)</tspan></text>
<text class="t1 cell strong" x="465" y="242" text-anchor="end">73.51</text>
<text class="t1 cell" x="535" y="242" text-anchor="end">105.04</text>
<text class="good cell strong" x="660" y="242" text-anchor="end">1.43x faster</text>
<text class="t1 cell strong" x="725" y="242" text-anchor="end">30.81</text>
<text class="t1 cell" x="795" y="242" text-anchor="end">40.91</text>
<text class="good cell strong" x="920" y="242" text-anchor="end">1.33x faster</text>
<line class="rule" x1="24" x2="920" y1="254" y2="254"/>
<text class="cell" x="24" y="276"><tspan class="t1">mixed: 5,016 files, 52 dirs</tspan><tspan class="t2"> · -l WORD</tspan></text>
<text class="t1 cell strong" x="465" y="276" text-anchor="end">61.99</text>
<text class="t1 cell" x="535" y="276" text-anchor="end">70.10</text>
<text class="good cell strong" x="660" y="276" text-anchor="end">1.13x faster</text>
<text class="t1 cell strong" x="725" y="276" text-anchor="end">26.25</text>
<text class="t1 cell" x="795" y="276" text-anchor="end">28.54</text>
<text class="good cell strong" x="920" y="276" text-anchor="end">1.09x faster</text>
<line class="rule" x1="24" x2="920" y1="288" y2="288"/>
<text class="cell" x="24" y="310"><tspan class="t1">mixed: 5,016 files, 52 dirs</tspan><tspan class="t2"> · WORD (lines)</tspan></text>
<text class="t1 cell strong" x="465" y="310" text-anchor="end">62.87</text>
<text class="t1 cell" x="535" y="310" text-anchor="end">72.18</text>
<text class="good cell strong" x="660" y="310" text-anchor="end">1.15x faster</text>
<text class="t1 cell strong" x="725" y="310" text-anchor="end">26.87</text>
<text class="t1 cell" x="795" y="310" text-anchor="end">28.64</text>
<text class="good cell strong" x="920" y="310" text-anchor="end">1.07x faster</text>
<line class="rule" x1="24" x2="920" y1="322" y2="322"/>
<text class="t3 note" x="24" y="346">15 warm runs per cell, process startup included. One thread: cgrep -j1, rg -j1 --sort path. Default: no thread option for either tool.</text>
<text class="t3 note" x="24" y="363">cgrep 0.1.0 (5a44692, c-utils 7750e1c); ripgrep 15.2.0 (rev e89fff89ac).</text>
<text class="t3 note" x="24" y="380">GitHub-hosted ubuntu-24.04 runner, 4 CPUs, AMD EPYC 7763 64-Core Processor. Shared runners are noisy: compare ratios.</text>
</svg>
